name: Test and build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install pytest Pillow
      - name: Tests (UI smoke tests under Xvfb)
        run: xvfb-run -a python -m pytest -q

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Mobile web app tests (phone-sized Chromium)
        run: python -m pytest -q tests/test_web.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (including real Windows API calls)
        run: python -m pytest -q
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name PersonalTimeTracker
          --icon assets/icon.ico --add-data "assets;assets" --hidden-import pystray._win32 main.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalTimeTracker-windows
          path: dist/PersonalTimeTracker.exe
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PersonalTimeTracker.exe
